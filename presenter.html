<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Hungerspiele – Präsentation</title>
    <link rel="stylesheet" href="css/presenter.css">
</head>
<body>

<header>
    <h1>Hungerspiele</h1>
</header>

<main>
    <div class="content-box" id="presenter-content">
        <h2>Warten auf Spielbeginn...</h2>
        <div class="fire-border"></div>
        <h3 id="subtitle"></h3>
    </div>
    <div class="highscore-box" id="highscoreBox">
        <div id="header-container">
            <div class="logo-row">
            <h1>Hungerspiele</h1>
            </div>
            <span id="highscore-title">HIGHSCORE</span>
        </div>

        <div class="highscore-list">
            <div class="entry gold" data-rank="1" data-team="Tisch1" data-score="0">
                <div class="rank">1</div>
                <span class="team-mark">T1</span>
                <div class="bar-wrapper">
                    <div class="bar"><span class="score">0 Punkte</span></div>
                </div>
            </div>

            <div class="entry silver" data-rank="2" data-team="Tisch2" data-score="0">
                <div class="rank">2</div>
                <span class="team-mark">T2</span>
                <div class="bar-wrapper">
                    <div class="bar"><span class="score">0 Punkte</span></div>
                </div>
            </div>

            <div class="entry bronze" data-rank="3" data-team="Tisch3" data-score="0">
                <div class="rank">3</div>
                <span class="team-mark">T3</span>
                <div class="bar-wrapper">
                    <div class="bar"><span class="score">0 Punkte</span></div>
                </div>
            </div>

            <!-- Platz 4-10 -->
            <div class="entry" data-rank="4" data-team="Tisch4" data-score="0">
                <div class="rank">4</div>
                <span class="team-mark">T4</span>
                <div class="bar-wrapper">
                    <div class="bar"><span class="score">0 Punkte</span></div>
                </div>
            </div>

            <div class="entry" data-rank="5" data-team="Tisch5" data-score="0">
                <div class="rank">5</div>
                <span class="team-mark">T5</span>
                <div class="bar-wrapper">
                    <div class="bar"><span class="score">0 Punkte</span></div>
                </div>
            </div>

            <div class="entry" data-rank="6" data-team="Tisch6" data-score="0">
                <div class="rank">6</div>
                <span class="team-mark">T6</span>
                <div class="bar-wrapper">
                    <div class="bar"><span class="score">0 Punkte</span></div>
                </div>
            </div>

            <div class="entry" data-rank="7" data-team="Tisch7" data-score="0">
                <div class="rank">7</div>
                <span class="team-mark">T7</span>
                <div class="bar-wrapper">
                    <div class="bar"><span class="score">0 Punkte</span></div>
                </div>
            </div>

            <div class="entry" data-rank="8" data-team="Tisch8" data-score="0">
                <div class="rank">8</div>
                <span class="team-mark">T8</span>
                <div class="bar-wrapper">
                    <div class="bar"><span class="score">0 Punkte</span></div>
                </div>
            </div>

            <div class="entry" data-rank="9" data-team="Tisch9" data-score="0">
                <div class="rank">9</div>
                <span class="team-mark">T9</span>
                <div class="bar-wrapper">
                    <div class="bar"><span class="score">0 Punkte</span></div>
                </div>
            </div>

            <div class="entry" data-rank="10" data-team="Tisch10" data-score="0">
                <div class="rank">10</div>
                <span class="team-mark">T10</span>
                <div class="bar-wrapper">
                    <div class="bar"><span class="score">0 Punkte</span></div>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="js/presenter.js"></script>
</body>
</html>
